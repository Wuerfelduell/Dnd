<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nebelakten" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Nebelakten</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      /* Ladebildschirm beim ersten Start: steht im HTML, damit er sofort da ist, noch bevor das Spiel (JS/CSS) geladen hat */
      #boot { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #06070d;
        font-family: 'Pixelify Sans', ui-monospace, monospace; font-size: calc(var(--k, 2) * 8px); color: #e6dcc8; transition: opacity 0.6s ease; -webkit-user-select: none; user-select: none; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .bt-bild { position: absolute; inset: -3%; background: #06070d url(./sprites/ui/laden_1.png) center / cover no-repeat; image-rendering: pixelated; opacity: 0; filter: brightness(0.42) saturate(0.8); animation: bt-zoom 40s ease-in-out infinite alternate; transition: opacity 1.2s; }
      #boot .bt-bild.da { opacity: 1; }
      #boot .bt-vign { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(6, 7, 13, 0.1) 30%, rgba(6, 7, 13, 0.92) 100%); }
      #boot .bt-nebel { position: absolute; left: -50%; right: -50%; bottom: 0; height: 45%; background: linear-gradient(0deg, rgba(150, 165, 185, 0.16), transparent); filter: blur(1em); animation: bt-nebel 14s ease-in-out infinite alternate; }
      #boot .bt-mitte { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; width: min(40em, 92vw); }
      #boot .bt-kicker { font-size: 0.75em; letter-spacing: 0.32em; text-transform: uppercase; color: #b08a52; }
      #boot .bt-titel { margin: 0.1em 0 0; font-size: 3.5em; line-height: 1; letter-spacing: 0.04em; font-weight: 600; color: #f2d488;
        background: linear-gradient(180deg, #fbe7a8 0%, #eac072 48%, #b4772f 52%, #d79a4c 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0.0625em 0 #3a2410) drop-shadow(0 0.0625em 0 #120a06) drop-shadow(0 0 0.35em rgba(240, 180, 90, 0.35)); }
      #boot .bt-orn { width: 16em; height: 2em; margin: 0.2em 0 1em; background: url(./sprites/ui/abspann_trenner.png) 0 0 / 600% 100%; image-rendering: pixelated; opacity: 0.9; }
      #boot .bt-tafel { display: flex; align-items: center; gap: 1em; width: 30em; max-width: 100%; padding: 0.6em 1.1em 0.6em 0.8em; text-align: left;
        border: 1em solid transparent; border-image: url(./sprites/ui/laden_rahmen.png) 8 fill / 1em stretch; image-rendering: pixelated; }
      #boot .bt-laterne { flex: none; width: 4em; height: 4em; background: url(./sprites/ui/laden_punkte.png) 0 0 / 400% 100%; image-rendering: pixelated;
        animation: bt-schwing 1.1s steps(3, jump-none) infinite alternate; filter: drop-shadow(0 0 0.5em rgba(255, 180, 80, 0.45)); }
      #boot .bt-rechts { flex: 1; min-width: 0; }
      #boot .bt-status { display: flex; justify-content: space-between; gap: 1em; font-size: 0.85em; color: #e8c070; }
      #boot .bt-prozent { color: #c8b892; font-variant-numeric: tabular-nums; }
      #boot .bt-balken { position: relative; height: 0.75em; margin: 0.35em 0 0.3em; background: #121019; box-shadow: 0 0 0 0.125em #050408, inset 0 0.125em 0 #000; }
      #boot .bt-fuell { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(180deg, #ffd98a 0 25%, #e8a64c 25% 75%, #9a6428 75%); transition: width 0.25s linear;
        box-shadow: 0 0 0.4em rgba(255, 170, 70, 0.55); }
      #boot .bt-fuell::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 0.875em, rgba(20, 12, 6, 0.55) 0.875em 1em); }
      #boot .bt-tipp { min-height: 2.6em; font-size: 0.7em; line-height: 1.35; color: #9a917f; transition: opacity 0.4s; }
      #boot .bt-tipp.weg { opacity: 0; }
      @keyframes bt-schwing { from { background-position: 0 0; } to { background-position: -12em 0; } }
      @keyframes bt-zoom { from { transform: scale(1); } to { transform: scale(1.08) translateX(-1.5%); } }
      @keyframes bt-nebel { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bt-bild, #boot .bt-nebel { animation: none; } }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="game"></div>
      <div id="ui"></div>
    </div>
    <div id="rotate">
      <div class="phone"></div>
      <div>Bitte dreh dein Handy ins Querformat.</div>
      <button type="button" data-rotate-fullscreen>Vollbild und drehen</button>
    </div>
    <div id="boot" aria-busy="true">
      <div class="bt-bild"></div>
      <div class="bt-nebel"></div>
      <div class="bt-vign"></div>
      <div class="bt-mitte">
        <span class="bt-kicker">Ein Mystery im Nebel</span>
        <div class="bt-titel">Nebelakten</div>
        <div class="bt-orn"></div>
        <div class="bt-tafel">
          <div class="bt-laterne"></div>
          <div class="bt-rechts">
            <div class="bt-status"><span class="bt-text">Das Spiel wird geladen …</span><span class="bt-prozent"></span></div>
            <div class="bt-balken"><div class="bt-fuell"></div></div>
            <div class="bt-tipp"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Ladebildschirm: Pixelgröße wie im Spiel (ganzzahlig), Hintergrundbild erst zeigen, wenn es geladen ist, Sprache vorab
      (function () {
        var el = document.getElementById('boot');
        var fit = function () { var r = Math.min(innerWidth / 480, innerHeight / 270); el.style.setProperty('--k', r < 2 ? Math.max(0.5, Math.floor(r * 20) / 20) : Math.floor(r)); };
        fit(); addEventListener('resize', fit);
        var img = new Image(); img.onload = function () { el.querySelector('.bt-bild').classList.add('da'); }; img.src = './sprites/ui/laden_1.png';
        try { if (localStorage.getItem('nebelakten-lang') === 'en') { document.documentElement.lang = 'en'; el.querySelector('.bt-kicker').textContent = 'A Mystery in the Fog'; el.querySelector('.bt-text').textContent = 'Loading the game …'; } } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
